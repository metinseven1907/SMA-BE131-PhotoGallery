<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <div class="baslik mb-5">
        <h1>Photo Gallery</h1>
    </div>

    <div class="container mb-5">
        
        <div class="row g-4">
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/151/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/151/1200/900', 'Yol')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/161/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/161/1200/900', 'Kutuk')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/171/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/171/1200/900', 'Yagmur')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/181/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/181/1200/900', 'Bina')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/191/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/191/1200/900', 'Dag Yolu')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/201/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/201/1200/900', 'Modern')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/211/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/211/1200/900', 'Tekne')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/221/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/221/1200/900', 'Sehir')">
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/231/800/600" class="img-fluid gallery-img"
                         data-bs-toggle="modal" data-bs-target="#imageModal"
                         onclick="updateModal('https://picsum.photos/id/231/1200/900', 'Doga')">
                </div>
            </div>
        </div>
    </div>

    
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalTitle">Görsel</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-0 text-center bg-black">
                    <img src="" id="modalImage" class="img-fluid">
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <script>
        function updateModal(imageSrc, title) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('modalTitle').innerText = title;
        }
    </script>
</body>
</html>
